<title>ออฟไลน์ · ZANA OS</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f2ea; color: #241c16;
    font-family: 'Sarabun', system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { font-size: 22px; margin: 18px 0 6px; }
  p { margin: 0 0 20px; color: #6b5d52; line-height: 1.6; }
  button { font: inherit; font-weight: 600; color: #fff; background: #c8785c; border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #9a4e32; outline-offset: 2px; }
</style>

<body>
<main>
  <img src="/icons/icon-192.png" alt="">

  <button type="button" onclick="location.reload()">ลองใหม่</button>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
